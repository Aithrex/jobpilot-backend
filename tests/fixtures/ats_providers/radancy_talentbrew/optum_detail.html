<html><script type="application/ld+json">{"@context": "http://schema.org", "@type": "JobPosting", "baseSalary": {"@type": "MonetaryAmount", "currency": "", "value": {"@type": "QuantitativeValue", "unitText": ""}}, "datePosted": "2026-11-05", "description": "<p><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong>Explore opportunities with</strong></span><span style='color:red;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong> </strong></span><span style='color:rgb(0,0,0);font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong>Assured Home Health,</strong></span><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong> a part of LHC Group.</strong> As part of the Optum family of businesses, we provide home health, hospice and community-based services that help people receive quality care where they feel most comfortable: at home. Rooted in personalized care, we support patients and provide comfort through each stage of their health journey, while building trusted relationships along the way. Find a home for your career here. Join us and embrace a culture of <strong>Caring. Connecting. Growing together.</strong></span></p><p>&nbsp;</p><p><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>The Licensed Practical Nurse in Home Health is responsible for providing quality patient care and performing technical skilled care in the patient's home.</span></p><p>&nbsp;</p><p><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong>Primary Responsibilities:</strong></span></p><ul><li><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Provides high quality clinical services within the scope of practice, as defined by the state laws governing the practice of nursing, in accordance with the plan of care, and in coordination with other members of the health care team, following all applicable infection control procedures</span></li><li><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Documents patient visits thoroughly and completely per regulatory and payer requirements in the electronic medical record utilizing the agency's electronic visit verification program (as applicable)</span></li><li><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Actively participates in the agency's care coordination process including timely reporting patients' needs and changes in condition, attending patient case conference, communicating effectively to the patient, family, physician, other clinicians, agency management staff, and case coordinator, community case managers (as applicable)</span></li><li><span style='font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Ability to function in any home situation regardless of age, race, creed, color, sex, disability, or financial condition of the client&nbsp;</span></li></ul><p>&nbsp;</p><p><span style='background-color:rgb(255,255,255);color:rgb(0,0,0);font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><span class='TextRun SCXW158646182 BCX8 NormalTextRun' style='-webkit-tap-highlight-color:transparent;-webkit-text-stroke-width:0px;-webkit-user-drag:none;font-style:normal;font-variant-caps:normal;font-variant-ligatures:none !important;font-weight:400;letter-spacing:normal;line-height:18.6px;margin:0px;orphans:2;padding:0px;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;user-select:text;white-space:pre-wrap;widows:2;word-spacing:0px;' data-contrast='auto' xml:lang='EN-US' lang='EN-US'>You'll be rewarded and recognized for your performance in an environment that will challenge you and give you clear direction on what it takes to succeed in your role as well as provide development for other roles you may be interested in.</span><span class='EOP SCXW158646182 BCX8' style='-webkit-tap-highlight-color:transparent;-webkit-text-stroke-width:0px;-webkit-user-drag:none;font-style:normal;font-variant-caps:normal;font-variant-ligatures:normal;font-weight:400;letter-spacing:normal;line-height:18.6px;margin:0px;orphans:2;padding:0px;text-align:left;text-decoration-color:initial;text-decoration-style:initial;text-decoration-thickness:initial;text-indent:0px;text-transform:none;user-select:text;white-space:pre-wrap;widows:2;word-spacing:0px;' data-ccp-props='{&quot;335559685&quot;:-20,&quot;335559737&quot;:-20}'>&nbsp;</span></span></p><p><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong>Required Qualifications:</strong></span></p><ul><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Current and unrestricted LPN &nbsp;licensure in state of practice</span></li><li><p><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Current driver's license and vehicle insurance, access to a dependable vehicle, or public transportation</span></p><p>&nbsp;</p></li></ul><p>&nbsp;</p><p><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><strong>Preferred Qualifications: &nbsp;</strong></span></p><ul><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Current CPR certification or ability to complete within 90 days of hire</span></li><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Home care experience</span></li><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Ability to manage multiple tasks simultaneously</span></li><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Able to work independently</span></li><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Good communication, writing, and organizational skills</span></li><li><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Ability to work flexible hours as required to meet identified client needs&nbsp;</span></li></ul><p>&nbsp;</p><p><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Pay Range&nbsp;</span><br><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>$46,564 - $69,846 annual total cash target pay</span><br><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>$26.86 - $40.30 per visit point</span><br><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>$22.39 - $33.58 hourly rate</span><br><br><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'>Annual total cash compensation for this role assumes full-time employment (40 weekly hours) at full productivity and generally follows the range above. Total cash compensation includes earnings from per visit point pay and hourly pay and is based on several factors including but not limited to local labor markets, education, work experience and may increase over time based on productivity and performance in the role. This role receives two types of compensation depending on the work being performed. When conducting visits, you will be paid per visit point rate compensation. Your per visit pay will be calculated by multiplying your per visit point rate by the productivity points you accrue for various types of visits. Each type of visit is assigned a certain number of productivity points that is inclusive of 'direct' and 'indirect' patient care activities. Visits are assigned based on patient and business needs. The number of visits performed each week will vary based on individual productivity targets and the productivity points assigned to the visits performed. You will be paid your hourly rate for certain non-visit activities such as orientation. We comply with all minimum wage laws as applicable. In addition to your pay, we offer benefits such as, a comprehensive benefits package, recognition programs, equity stock purchase and 401k contribution (all benefits are subject to eligibility requirements). No matter where or when you begin a career with us, you'll find a far-reaching choice of benefits and incentives.</span></p><p style='text-align:center;'>#LHCJobs</p><p style='text-align:center;'><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><i>At UnitedHealth Group, our mission is to help people live healthier lives and help make the health system work better for everyone. Together, we are shaping the future of healthcare by harnessing technology and innovation to make care simpler to navigate, more affordable and more connected for the people we serve. We are committed to creating an inclusive workplace where everyone feels welcomed, valued, heard and respected, empowering people to bring their authentic selves to work and strengthening our collective impact through diverse talents, backgrounds, experiences and perspectives.</i></span></p><p style='text-align:center;'>&nbsp;</p><p style='text-align:center;'>&nbsp;</p><p style='text-align:center;'><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><i>UnitedHealth Group and its affiliated brands are an Equal Employment Opportunity employer under applicable law and qualified applicants will receive consideration for employment without regard to race, national origin, religion, age, color, sex, sexual orientation, gender identity, disability, or protected veteran status, or any other characteristic protected by local, state, or federal laws, rules, or regulations.</i></span></p><p style='text-align:center;'><br><span style='color:black;font-family:Tahoma, Geneva, sans-serif;font-size:10px;'><i>UnitedHealth Group and its affiliated brands are a drug-free workplace. Candidates&nbsp;are required to&nbsp;pass a drug test before beginning employment.&nbsp;</i></span></p>", "identifier": {"@type": "PropertyValue", "name": "Job ID", "value": "2399205"}, "title": "Licensed Practical Nurse (LPN)"
