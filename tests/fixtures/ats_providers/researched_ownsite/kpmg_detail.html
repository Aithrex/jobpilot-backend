    "description": "&lt;p&gt;The KPMG Advisory practice is at the forefront of transformation, offering excellent opportunities for individuals to advance their careers and expertise with KPMG. Looking ahead, we anticipate continued evolution and success within the practice, fostering both personal and professional development, thereby creating new pathways for growth. In this ever-changing market environment, our professionals must be adaptable and thrive in a collaborative, team-driven culture. At KPMG, our people are our number one priority. With a wealth of learning and career development opportunities, a world-class training facility, and leading market tools, we help our people continue to grow both professionally and personally. If you&#039;re looking for a firm with a strong team connection where you can be your whole self, have an impact, advance your skills, deepen your experiences, and have the flexibility and access to constantly find new areas of inspiration and expand your capabilities, then consider a career in Advisory.&lt;/p&gt; 
 &lt;p&gt;KPMG is currently seeking a Sales Executive, Databricks in the Federal sector to join our Alliances organization.&lt;/p&gt;&lt;h3 class=&quot;h5&quot;&gt;Responsibilities:&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Lead all aspects of the customer acquisition life cycle for Federal clients, including pipeline development, account planning and management, opportunity pursuit, meeting follow-up, proposal development, client procurement, contract negotiation, risk management, statement of work (SOW) development, and revenue attainment&lt;/li&gt;&lt;li&gt;Define and execute joint go-to-market plans with KPMG Federal and Databricks Public Sector teams, targeting priority Federal agencies and accounts; develop relationships and joint sales plans for priority Federal accounts with Databricks Public Sector sales teams, aligning KPMG account teams with Databricks account executives, sales leadership, and partner teams&lt;/li&gt;&lt;li&gt;Build market awareness of KPMG&#039;s Databricks services offerings, capabilities, and credentials across the Federal sector and drive awareness and activation of relevant KPMG solutions within the Databricks Public Sector sales organization&lt;/li&gt;&lt;li&gt;Educate KPMG account teams, the Databricks field organization, and Federal clients on how Databricks-enabled data, analytics, and AI solutions can help address client needs and solve complex mission, business, and technology challenges&lt;/li&gt;&lt;li&gt;Serve as a Solution Specialist for KPMG&#039;s Databricks services solutions, bringing knowledge of the Federal market and Databricks ecosystem to client pursuits and helping shape account, sales, and pursuit strategies&lt;/li&gt;&lt;li&gt;Source and qualify new opportunities from target through close, generating new pipeline and activating the Databricks sales channel for KPMG opportunities&lt;/li&gt;&lt;li&gt;Bring focus, energy, and go-to-market skills to help our firm identify and pursue Federal opportunities, win more business, shorten sales cycle times, and improve our overall win rate&lt;/li&gt;&lt;li&gt;Act with integrity, professionalism, and personal responsibility to uphold KPMG&#039;s respectful and courteous work environment&lt;/li&gt;&lt;/ul&gt;&lt;h3 class=&quot;h5&quot;&gt;Qualifications:&lt;/h3&gt;&lt;ul&gt;&lt;li&gt;Minimum ten years of recent solution sales experience, preferably focused on Federal government accounts with a verifiable track record of exceeding expectations in enterprise technology, cloud, data, analytics, and/or AI sales; experience with Databricks or similar technology preferred&lt;/li&gt;&lt;li&gt;Bachelor&#039;s degree in business or related field from an accredited college/university preferred; or minimum of a high school diploma or GED required plus twelve years of previous experience in enterprise-level technology sales&lt;/li&gt;&lt;li&gt;Strong knowledge of the Federal technology market and Databricks ecosystem; demonstrated understanding of data modernization, analytics, cloud, and AI solutions and their application to Federal agency priorities and mission needs&lt;/li&gt;&lt;li&gt;Experience developing joint account and sales plans, identifying new opportunities, building qualified pipeline, and working with technology alliance partners and their field sales organizations preferred; exceptional consultative and interpersonal skills that have resulted in trusted business relationships and successful pursuit of complex, multimillion-dollar technology and services opportunities&lt;/li&gt;&lt;li&gt;Existing relationships with Databricks Public Sector sales professionals and/or Federal agency and industry stakeholders preferred; ability to understand complex content and relate it to Federal agency priorities, client needs, industry issues, Databricks capabilities, and KPMG service offerings&lt;/li&gt;&lt;li&gt;Demonstrated superior ability to develop and lead relationship-building activities with senior Federal agency executives, technology leaders, mission and program stakeholders, and other key decision-makers&lt;/li&gt;&lt;li&gt;Ability to travel as necessary&lt;/li&gt;&lt;li&gt;Applicants must be authorized to work in the U.S. without the need for employment-based visa sponsorship now or in the future; KPMG LLP will not sponsor applicants for U.S. work visa status for this opportunity (no sponsorship is available for H-1B, L-1, TN, O-1, E-3, H-1B1, F-1, J-1, OPT, CPT or any other employment-based visa)&lt;/li&gt;&lt;/ul&gt; 
 &lt;div&gt;KPMG LLP and its affiliates and subsidiaries (&ldquo;KPMG&rdquo;) complies with all local/state regulations regarding displaying salary ranges. If required, the ranges displayed below or via the URL below are specifically for those potential hires who will work in the location(s) listed. Any offered salary is determined based on relevant factors such as applicant&#039;s skills, job responsibilities, prior relevant experience, certain degrees and certifications and market considerations. In addition, KPMG LLP is proud to offer a comprehensive, competitive benefits package, with options designed to help you make the best decisions for yourself, your family, and your lifestyle. Available benefits are based on eligibility. &lt;a href=&quot;https://resources.kpmguscareers.com/KPMGLLP_BenefitsSummary.pdf&quot; target=&quot;_blank&quot; rel=&quot;noreferrer noopener&quot;&gt;Depending on job classification&lt;/a&gt;, standard work hours, and years of service, KPMG LLP provides a Total Rewards Package that includes 401(k) and medical and may include dental, vision, disability and life insurance, personal well-being and Personal Time Off. Additionally, each year KPMG publishes a calendar of holidays to be observed during the year depending on your job classification and entity affiliation.&amp;nbsp; Additional details about our benefits can be found towards the bottom of our KPMG US Careers site at &lt;a href=&quot;https://www.kpmguscareers.com/why-kpmg/#benefits&quot; target=&quot;_blank&quot; rel=&quot;noreferrer noopener&quot;&gt;Benefits &amp;amp; How We Work&lt;/a&gt;.&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Follow this link to obtain salary ranges by city outside of CA:&lt;/div&gt; 
 &lt;a href=&quot;https://kpmg.com/us/en/how-we-work/pay-transparency.html/?id=4108_9_26&quot; target=&quot;_blank&quot;&gt;https://kpmg.com/us/en/how-we-work/pay-transparency.html/?id=4108_9_26&lt;/a&gt; 
  
 &lt;div&gt;&lt;div&gt;KPMG LLP and its affiliates and subsidiaries (&quot;KPMG&quot;) is an equal opportunity employer. KPMG complies with all applicable federal, state, and local laws regarding recruitment and hiring. All qualified applicants are considered for employment without regard to race/ethnicity, color, creed, religion, age, sex/gender, national origin, ancestry, citizenship status, marital status, sexual orientation, gender identity or expression, disability, pregnancy, childbirth or other related condition, military/veteran status, genetic information, status as a victim of domestic violence or sexual abuse or any other legally protected status. The attached &lt;u&gt;&lt;a href=&quot;https://resources.kpmguscareers.com/EEO.pdf&quot; target=&quot;_blank&quot; style=&quot;color: rgb(0, 125, 188);&quot;&gt;link&lt;/a&gt;&lt;/u&gt; contains further information regarding the firm&#039;s compliance with federal, state, and local recruitment and hiring laws.&amp;nbsp;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;/div&gt;&lt;div&gt;KPMG recruits on a rolling basis. Candidates are considered as they apply, until the opportunity is filled. Candidates are encouraged to apply expeditiously to any role(s) for which they are qualified that is also of interest to them.&amp;nbsp;&lt;/div&gt;&lt;div&gt;&lt;br&gt;&lt;/div&gt;&lt;div&gt;Los Angeles County applicants: Material job duties for this position are listed above. Criminal history may have a direct, adverse, and negative relationship with some of the material job duties of this position. These include the duties and responsibilities listed above, as well as the abilities to adhere to company policies, exercise sound judgment, effectively manage stress and work safely and respectfully with others, exhibit trustworthiness, and safeguard business operations and company reputation. Pursuant to the California Fair Chance Act, Los Angeles County Fair Chance Ordinance for Employers, Fair Chance Initiative for Hiring Ordinance, and San Francisco Fair Chance Ordinance, we will consider for employment qualified applicants with arrest and conviction records.&lt;/div&gt;"
