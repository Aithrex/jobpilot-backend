<!doctype html>
<!-- Aithrex-owned synthetic fixture. Workday "My Information" wizard step (THEME A).
     Every field is keyed by a stable data-automation-id (Workday's theme-independent
     hook); the tenant CSS classes here (wd-theme-canvas / wd-blue) are cosmetic and
     MUST NOT drive detection or fill. NEVER a real employer. -->
<html><head><meta charset="utf-8"><title>Apply - Aithrex (Workday)</title></head>
<body class="wd-theme-canvas wd-blue">
<div data-automation-id="myInformationPage" class="wd-step">
  <h1>My Information</h1>
  <div data-automation-id="formField-legalNameSection_firstName" class="wd-field">
    <label>First Name</label>
    <input data-automation-id="legalNameSection_firstName" aria-label="First Name" type="text" required>
  </div>
  <div data-automation-id="formField-legalNameSection_lastName" class="wd-field">
    <label>Last Name</label>
    <input data-automation-id="legalNameSection_lastName" aria-label="Last Name" type="text" required>
  </div>
  <div data-automation-id="formField-email" class="wd-field">
    <label>Email Address</label>
    <input data-automation-id="email" aria-label="Email Address" type="email" required>
  </div>
  <div data-automation-id="formField-phone" class="wd-field">
    <label>Phone Number</label>
    <input data-automation-id="phone-number" aria-label="Phone Number" type="tel">
  </div>
  <div data-automation-id="formField-resume" class="wd-field">
    <label>Resume</label>
    <input data-automation-id="resume" aria-label="Resume" type="file">
  </div>
  <div data-automation-id="formField-source" class="wd-field">
    <button data-automation-id="source" aria-haspopup="listbox" aria-label="How did you hear about us?" type="button">Select One</button>
  </div>
  <div data-automation-id="pageFooter" class="wd-footer">
    <button data-automation-id="pageFooterNextButton" type="button">Save and Continue</button>
  </div>
</div>
</body></html>
