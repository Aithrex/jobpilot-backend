<!doctype html>
<!-- Aithrex-owned synthetic fixture. The form re-rendered with VISIBLE validation
     errors: an aria-invalid control + a shown .field-error/[role=alert] message. -->
<html><head><meta charset="utf-8"><title>Apply - Aithrex</title></head>
<body>
<form id="application_form" action="https://boards.greenhouse.io/aithrex/jobs/4200" method="post">
  <label for="first_name">First Name</label>
  <input id="first_name" name="first_name" type="text" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" aria-invalid="true" required>
  <div class="field-error" role="alert">Email is required.</div>
  <div id="application-confirmation" style="display:none"></div>
  <button type="submit">Submit application</button>
</form>
</body></html>
