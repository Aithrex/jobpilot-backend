<!doctype html>
<!-- Aithrex-owned synthetic fixture. A plain company careers form on NO known ATS
     host. The generic adapter may fill it but defaults to human review/takeover. -->
<html><head><meta charset="utf-8"><title>Careers - ExampleCo</title></head>
<body>
<h1>Apply: Software Engineer</h1>
<form action="/careers/apply/software-engineer" method="post">
  <label for="full_name">Full name</label>
  <input id="full_name" name="full_name" type="text" required>
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="message">Why do you want to work here?</label>
  <textarea id="message" name="message"></textarea>
  <button type="submit">Send application</button>
</form>
</body></html>
