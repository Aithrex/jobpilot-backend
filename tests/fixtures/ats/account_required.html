<!doctype html>
<!-- Aithrex-owned synthetic fixture. An account/login gate in front of the form:
     a password field + "Create an account to apply". The adapter must NOT try to
     auto-create the account -> pause as waiting_human. -->
<html><head><meta charset="utf-8"><title>Sign in - Aithrex</title></head>
<body>
<h1>Create an account to apply</h1>
<form id="account_form" action="https://boards.greenhouse.io/aithrex/jobs/4200" method="post">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" required>
  <button type="submit">Create account</button>
</form>
<p>Already have an account? Sign in.</p>
<div id="application-confirmation" style="display:none"></div>
</body></html>
