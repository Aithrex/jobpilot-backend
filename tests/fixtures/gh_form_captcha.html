<!doctype html>
<html><head><meta charset="utf-8"><title>Apply - Test Role</title></head>
<body>
<h1>Apply for Test Role</h1>
<!-- Same form, but guarded by a reCAPTCHA challenge iframe. The executor must
     detect the challenge and report a WALL_CAPTCHA (freeze/thaw), NOT submit. -->
<form id="appform" onsubmit="return false">
  <input id="first_name" type="text">
  <input id="email" type="text">
  <input id="resume" type="file">
  <!-- A real, VISIBLE challenge frame (the reCAPTCHA `bframe`), not the tiny
       invisible anchor badge — this is what a genuine block looks like. -->
  <iframe title="recaptcha challenge" src="https://www.google.com/recaptcha/api2/bframe?k=test"
          width="302" height="422" style="display:block"></iframe>
  <button type="button" onclick="document.getElementById('application-confirmation').style.display='block'">
    Submit application
  </button>
</form>
<div id="application-confirmation" style="display:none">Thank you for applying</div>
</body></html>
