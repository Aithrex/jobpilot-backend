# Offline test + Voice Graph eval suite (§6.12.9).
#
# Fully deterministic: mongomock for Mongo, a FakeLLM for Bedrock, fpdf2/pypdf
# for the ATS roundtrip. NO AWS credentials, NO secrets, NO network calls —
# this workflow must stay green on a fork with zero repository secrets.
#
# NOTE: deploy.yml's detect-changes step treats `.github/workflows/**` as a
# shared-layer change, so merging any edit to this file triggers one full
# 4-service redeploy. Accepted trade-off.
name: tests

on:
  # main only: deploy.yml waits for THIS run on the merge commit. A pull
  # request is covered by its own run below; running on every branch push
  # as well tested each PR commit twice (2026-11-05).
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-suite:
    name: Offline tests + evals
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    timeout-minutes: 25
    env:
      # Mirrors deploy.yml's smoke test: never touch SSM / prod guards in CI.
      ENVIRONMENT: development
      USE_SSM_SECRETS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          # Both parents of the commit under test, for the docs-only diff.
          fetch-depth: 2

      # Test the code we ship ONCE. A pull request runs the suite on the tree
      # GitHub would merge and records that tree on its head commit. The push
      # to main that merges it is then the SAME tree in the common case (main
      # did not move in between), and re-running the suite there only re-proves
      # what was proven; deploy.yml still sees a green run for the merge commit.
      # When main DID move, the trees differ and the full suite runs, which is
      # exactly the case the re-run exists for.
      - name: Decide what this run must test
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TREE=$(git rev-parse 'HEAD^{tree}')
          echo "tree=$TREE" >> "$GITHUB_OUTPUT"
          echo "tree under test: $TREE"
          # 1. Only docs changed: nothing the suite reads moved.
          if git rev-parse -q --verify 'HEAD^1' >/dev/null; then
            CHANGED=$(git diff --name-only 'HEAD^1' HEAD)
            if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -qvE '^docs/|\.md$'; then
              printf 'Only docs changed:\n%s\n' "$CHANGED"
              echo "skip=docs-only" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # 2. On main: a pull request already passed on this exact tree.
          if [ "$EVENT" = "push" ]; then
            HEADS=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[].head.sha' 2>/dev/null || true)
            for H in $HEADS; do
              if gh api "repos/${GITHUB_REPOSITORY}/commits/${H}/statuses?per_page=100" \
                   --jq ".[] | select(.context == \"tests/tested-tree\" and .state == \"success\" and .description == \"${TREE}\") | .id" \
                   2>/dev/null | grep -q .; then
                echo "Pull request head ${H:0:7} passed on this exact tree; not re-running."
                echo "### Reused the pull request's green run (tree \`${TREE:0:12}\`)" >> "$GITHUB_STEP_SUMMARY"
                echo "skip=reused" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
          fi
          echo "skip=" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.skip == ''
        with:
          # Matches deploy.yml's PY_VERSION (the Lambda runtime).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            shared/python/requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        if: steps.plan.outputs.skip == ''
        run: |
          python -m pip install --upgrade pip
          pip install -r shared/python/requirements.txt -r requirements-dev.txt

      - name: Run test + eval suite
        if: steps.plan.outputs.skip == ''
        # Same entry point as local / pre-push: scripts/verify.py --full.
        # Not parallel: pytest-xdist -n auto measured SLOWER here (616 s vs
        # 568 s serial, 2026-11-05) - a few long tests dominate the wall clock.
        run: python scripts/verify.py --full

      - name: Record the tree this pull request passed on
        # Read by the plan step of the push to main that merges it. Best
        # effort: a fork's read-only token cannot write it, and then main
        # simply runs the full suite.
        if: success() && github.event_name == 'pull_request' && steps.plan.outputs.skip == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TREE: ${{ steps.plan.outputs.tree }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=tests/tested-tree \
            -f description="${TREE}" >/dev/null
          echo "Recorded tree ${TREE:0:12} on ${HEAD_SHA:0:7}."
