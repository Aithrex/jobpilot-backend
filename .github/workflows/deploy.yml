name: Deploy Backend to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT: jobpilot
  ENVIRONMENT: prod
  PY_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.resolve.outputs.services }}
      any: ${{ steps.resolve.outputs.any }}
      shared: ${{ steps.filter.outputs.shared }}
      executor: ${{ steps.filter.outputs.executor }}
      ingest: ${{ steps.filter.outputs.ingest }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            shared:  ['shared/**', 'infra/**', '.github/workflows/**', 'scripts/build_layer.sh', 'scripts/package.sh']
            # The image does `COPY shared/python /opt/python` — the WHOLE tree —
            # so it depends on every shared module, not a hand-picked few. The
            # old three-file list silently shipped a stale executor: fixes to
            # application_question_bank / apply_forms / ats_adapters deployed to
            # the four zip Lambdas but never reached the container that actually
            # fills forms, so prod ran old fill logic (2026-07-29). Keep this in
            # step with the COPY above, not with a guess about imports.
            executor: ['services/apply_executor/**', 'shared/python/**']
            # The EC2 crawler tars exactly these two trees (see
            # infra/ec2/deploy-ingest-runner.sh), so this filter mirrors the
            # tarball rather than guessing at imports -- the same lesson the
            # executor filter above learned the hard way.
            ingest:  ['services/ingest_runner/**', 'shared/python/**', 'infra/ec2/**']
            auth:    ['services/auth/**']
            jobs:    ['services/jobs/**']
            resume:  ['services/resume/**']
            billing: ['services/billing/**']
      - id: resolve
        run: |
          MANUAL=${{ github.event_name == 'workflow_dispatch' }}
          SHARED=${{ steps.filter.outputs.shared }}
          declare -a S=()
          # A shared-layer or manual change => redeploy ALL services (layer version bump).
          if [ "$MANUAL" = "true" ] || [ "$SHARED" = "true" ]; then
            S=(auth jobs resume billing)
          else
            [ "${{ steps.filter.outputs.auth }}" = "true" ]    && S+=(auth)
            [ "${{ steps.filter.outputs.jobs }}" = "true" ]    && S+=(jobs)
            [ "${{ steps.filter.outputs.resume }}" = "true" ]  && S+=(resume)
            [ "${{ steps.filter.outputs.billing }}" = "true" ] && S+=(billing)
          fi
          if [ ${#S[@]} -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${S[@]}" | jq -R . | jq -sc . | sed 's/^/services=/' >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "services=[]" >> "$GITHUB_OUTPUT"
          fi

  # ---------------------------------------------------------------------------
  # Deploys used to race the suite. `deploy.yml` and `tests.yml` both trigger
  # on push to main and ran in PARALLEL with nothing between them, so a red
  # suite never held anything back -- on 2026-09-02 a commit whose tests were
  # failing deployed to all four Lambdas, and so did the two after it.
  #
  # `needs:` cannot cross workflows, so this waits on the tests RUN for this
  # exact SHA. Not "the latest run on main": that would let a green run from a
  # different commit wave this one through, which is the failure mode a naive
  # gate has.
  #
  # ADVISORY until someone sets the repo variable REQUIRE_GREEN_TESTS=true. It
  # reports the verdict on every deploy either way, so the signal is there from
  # day one; flipping the variable is what turns a report into a refusal. Ship
  # it enforcing on a red main and it gets disabled in anger instead.
  await-tests:
    name: Wait for the offline suite
    runs-on: ubuntu-latest
    steps:
      - name: Poll the tests workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_dispatch is the documented escape hatch: a human asking
          # for a deploy has, by asking, taken the decision the gate exists to
          # force. It is logged either way.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::warning::Manual dispatch - the test gate is bypassed by design."
            exit 0
          fi

          API="repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs"
          for attempt in $(seq 1 60); do
            CONCLUSION=$(gh api "$API?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"' 2>/dev/null || echo pending)
            STATUS=$(gh api "$API?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].status // "missing"' 2>/dev/null || echo missing)
            echo "attempt ${attempt}: status=${STATUS} conclusion=${CONCLUSION}"

            case "$CONCLUSION" in
              success)
                echo "Offline suite is green for ${GITHUB_SHA:0:7}."
                exit 0 ;;
              failure|cancelled|timed_out)
                # ADVISORY BY DEFAULT. The gate is only worth enforcing once
                # main is actually green: main was red on 2026-09-03 from
                # unrelated tailoring/ATS work, and a gate that blocks every
                # deploy on somebody else's failing suite gets switched off in
                # anger rather than respected. Set the repo variable
                # REQUIRE_GREEN_TESTS=true to make it enforce.
                if [ "${{ vars.REQUIRE_GREEN_TESTS }}" = "true" ]; then
                  echo "::error::Offline suite concluded '${CONCLUSION}' for ${GITHUB_SHA:0:7}; refusing to deploy."
                  exit 1
                fi
                echo "::warning::Offline suite concluded '${CONCLUSION}' for ${GITHUB_SHA:0:7}. Deploying anyway because REQUIRE_GREEN_TESTS is not 'true'."
                exit 0 ;;
            esac
            sleep 20
          done

          # A suite that never reports is NOT a pass. Twenty minutes is well
          # past the ~4 minute suite; something is wrong and a human should
          # look rather than have prod updated on no evidence.
          if [ "${{ vars.REQUIRE_GREEN_TESTS }}" = "true" ]; then
            echo "::error::No conclusive tests run for ${GITHUB_SHA:0:7} after 20 minutes; refusing to deploy."
            exit 1
          fi
          echo "::warning::No conclusive tests run for ${GITHUB_SHA:0:7} after 20 minutes; deploying anyway (REQUIRE_GREEN_TESTS is not 'true')."
          exit 0

  # ---------------------------------------------------------------------------
  deploy-layer:
    name: Build & publish shared layer
    runs-on: ubuntu-latest
    needs: [detect-changes, await-tests]
    if: needs.detect-changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch'
    outputs:
      layer_arn: ${{ steps.publish.outputs.layer_arn }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build layer
        run: bash scripts/build_layer.sh "${{ env.PY_VERSION }}"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: publish
        name: Publish layer version
        run: |
          ARN=$(aws lambda publish-layer-version \
            --layer-name "${PROJECT}-shared-${ENVIRONMENT}" \
            --zip-file fileb://build/layer.zip \
            --compatible-runtimes "python${PY_VERSION}" \
            --query 'LayerVersionArn' --output text)
          echo "layer_arn=${ARN}" >> "$GITHUB_OUTPUT"
          echo "Published $ARN"

  # ---------------------------------------------------------------------------
  deploy-services:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [detect-changes, deploy-layer, await-tests]
    # deploy-layer may be skipped (no shared change); only fail if it actually failed.
    #
    # `await-tests` is checked EXPLICITLY for success, not merely listed in
    # `needs`. `!cancelled()` runs this job even when a dependency was skipped,
    # so without the explicit check a failed gate would skip `deploy-layer`
    # and then deploy the services anyway -- a gate that stops the layer and
    # waves the code through is worse than no gate, because it looks like one.
    if: >-
      needs.detect-changes.outputs.any == 'true' && !cancelled()
      && needs.deploy-layer.result != 'failure'
      && needs.await-tests.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: Smoke test (import create_app)
        env:
          ENVIRONMENT: development   # don't trigger the prod-secret guard in CI
          USE_SSM_SECRETS: "false"
        run: |
          python -m pip install --quiet -r shared/python/requirements.txt
          cd "services/${{ matrix.service }}"
          PYTHONPATH="${GITHUB_WORKSPACE}/shared/python:${PWD}" \
            python -c "import app; app.create_app(); print('${{ matrix.service }}: import OK')"

      - name: Package
        run: bash scripts/package.sh "${{ matrix.service }}"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update function code
        run: |
          FN="${PROJECT}-${{ matrix.service }}-${ENVIRONMENT}"
          aws lambda update-function-code \
            --function-name "$FN" \
            --zip-file "fileb://build/${{ matrix.service }}.zip" \
            --publish --no-cli-pager
          aws lambda wait function-updated --function-name "$FN"

      - name: Point function at new layer (only if layer was republished)
        if: needs.deploy-layer.result == 'success' && needs.deploy-layer.outputs.layer_arn != ''
        run: |
          FN="${PROJECT}-${{ matrix.service }}-${ENVIRONMENT}"
          aws lambda update-function-configuration \
            --function-name "$FN" \
            --layers "${{ needs.deploy-layer.outputs.layer_arn }}" --no-cli-pager
          aws lambda wait function-updated --function-name "$FN"

  # ---------------------------------------------------------------------------
  # The auto-apply browser fleet is a CONTAINER-image Lambda (Playwright +
  # Chromium), deployed separately from the four zip services. Rebuilt on a
  # change to services/apply_executor/** or the executor's shared modules.
  deploy-apply-executor:
    name: Build & deploy apply-executor image
    runs-on: ubuntu-latest
    needs: [detect-changes, await-tests]
    if: needs.detect-changes.outputs.executor == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: login
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push image
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          REPO="${REGISTRY}/${PROJECT}-apply-executor-${ENVIRONMENT}"
          # --provenance/--sbom=false: attestation manifests make an OCI index
          # that Lambda rejects ("image manifest ... not supported").
          docker build --platform linux/amd64 --provenance=false --sbom=false \
            -f services/apply_executor/Dockerfile -t "$REPO:prod" .
          docker push "$REPO:prod"
      - name: Update function code
        env:
          REGISTRY: ${{ steps.login.outputs.registry }}
        run: |
          FN="${PROJECT}-apply-executor-${ENVIRONMENT}"
          aws lambda update-function-code --function-name "$FN" \
            --image-uri "${REGISTRY}/${PROJECT}-apply-executor-${ENVIRONMENT}:prod" \
            --publish --no-cli-pager
          aws lambda wait function-updated --function-name "$FN"

  # ---------------------------------------------------------------------------
  # The crawl does NOT run on Lambda. `ingest_runner` is a systemd unit on an
  # EC2 box (all four sources plus discovery, EventBridge rules disabled), and
  # until this job existed nothing shipped code to it -- `deploy.yml` knew only
  # about Lambda. Measured 2026-09-02: the box was running a build 20 hours
  # older than main, so 733 postings an hour were arriving with no
  # `canonical_employer_id` because `job_inventory_service.upsert_posting`
  # stamps it and that module had never reached the box.
  #
  # Deployment is by SSM, not SSH: no inbound port, no key material in CI, and
  # the same path the operator script uses.
  deploy-ingest-runner:
    name: Deploy ingest runner (EC2)
    runs-on: ubuntu-latest
    needs: [detect-changes, await-tests]
    if: needs.detect-changes.outputs.ingest == 'true' || github.event_name == 'workflow_dispatch'
    env:
      INSTANCE_ID: ${{ vars.INGEST_INSTANCE_ID || 'i-06bf0e03e60d9d409' }}
      DEPLOY_BUCKET: jobpilot-resumes-prod-032398581420
      KEY_PREFIX: deploy/ingest-runner
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and upload
        run: |
          set -euo pipefail
          # EXACTLY what infra/ec2/deploy-ingest-runner.sh packages. The other
          # services stay off the box on purpose: a crawler has no business
          # holding the auth blueprints.
          tar -czf app.tar.gz \
            --exclude='__pycache__' --exclude='*.pyc' --exclude='.git' \
            shared/python services/ingest_runner
          echo "packaged $(du -h app.tar.gz | cut -f1)"
          aws s3 cp app.tar.gz "s3://${DEPLOY_BUCKET}/${KEY_PREFIX}/app.tar.gz" \
            --only-show-errors
          aws s3 cp infra/ec2/install-ingest-runner.sh \
            "s3://${DEPLOY_BUCKET}/${KEY_PREFIX}/install.sh" --only-show-errors

      - name: Install and restart over SSM
        run: |
          set -euo pipefail
          cat > params.json <<'JSON'
          {"commands":[
            "set -e",
            "/opt/jobpilot/venv/bin/python -c \"import boto3;boto3.client('s3').download_file('jobpilot-resumes-prod-032398581420','deploy/ingest-runner/install.sh','/tmp/install.sh')\"",
            "bash /tmp/install.sh"
          ]}
          JSON
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ingest runner ${GITHUB_SHA:0:7}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "SSM command $ID"

          # The unit drains in-flight shards for up to 150s on SIGTERM, and pip
          # may rebuild a wheel, so allow real time before calling it stuck.
          for _ in $(seq 1 120); do
            STATUS=$(aws ssm get-command-invocation --command-id "$ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}' \
            --output json | tail -80

          # FAIL THE JOB on anything but Success. The install script import-checks
          # before it restarts, so a red job here means the box is still running
          # the previous build -- which is the safe outcome, and one somebody
          # has to be told about rather than left to find in a coverage number.
          [ "$STATUS" = "Success" ]

      - name: Confirm the unit came back
        run: |
          set -euo pipefail
          ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "verify ingest runner" \
            --parameters 'commands=["systemctl is-active ingest-runner"]' \
            --query 'Command.CommandId' --output text)
          sleep 8
          ACTIVE=$(aws ssm get-command-invocation --command-id "$ID" \
            --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text | tr -d '[:space:]')
          echo "ingest-runner: $ACTIVE"
          [ "$ACTIVE" = "active" ]

  # ---------------------------------------------------------------------------
  verify:
    name: Verify
    runs-on: ubuntu-latest
    needs: [deploy-services]
    if: always() && needs.deploy-services.result == 'success'
    steps:
      - name: Health check via the edge
        continue-on-error: true
        run: |
          set +e
          for i in 1 2 3; do
            if curl -fsS --max-time 15 https://aspirely.me/api/health; then
              echo "health ok"
              exit 0
            fi
            sleep 5
          done
          echo "health check pending (edge/DNS not live yet)"
          exit 0
