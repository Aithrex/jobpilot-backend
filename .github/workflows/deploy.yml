name: Deploy Backend to Oracle

# The box PULLS (infra/oracle/pull-deploy.sh): this workflow never touches it.
# It holds no server credentials and the box opens no port for it. CI moves
# `deploy/ingest-runner` to a commit the suite passed, then refuses to call it
# deployed until the live site reports that commit. The swap itself has no
# downtime (infra/compose/deploy.sh).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  await-tests:
    name: Wait for the offline suite
    runs-on: ubuntu-latest
    steps:
      - name: Poll the tests workflow for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          API="repos/${GITHUB_REPOSITORY}/actions/workflows/tests.yml/runs"
          for attempt in $(seq 1 60); do
            CONCLUSION=$(gh api "$API?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].conclusion // "pending"' 2>/dev/null || echo pending)
            STATUS=$(gh api "$API?head_sha=${GITHUB_SHA}&per_page=1" \
              --jq '.workflow_runs[0].status // "missing"' 2>/dev/null || echo missing)
            echo "attempt ${attempt}: status=${STATUS} conclusion=${CONCLUSION}"

            case "$CONCLUSION" in
              success)
                echo "Offline suite is green for ${GITHUB_SHA:0:7}."
                exit 0 ;;
              failure|cancelled|timed_out)
                echo "::error::Offline suite concluded '${CONCLUSION}' for ${GITHUB_SHA:0:7}; refusing to deploy."
                exit 1 ;;
            esac
            sleep 20
          done

          echo "::error::No conclusive tests run for ${GITHUB_SHA:0:7} after 20 minutes; refusing to deploy."
          exit 1

  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to the Oracle box
    runs-on: ubuntu-latest
    needs: [await-tests]
    if: needs.await-tests.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish this SHA to the deploy branch
        run: git push --force origin "HEAD:refs/heads/deploy/ingest-runner"

      - name: Wait for the live site to report this SHA
        run: |
          TAG="${GITHUB_SHA:0:12}"
          # Poll every 2 min on the box + image build + health gate.
          for attempt in $(seq 1 60); do
            REV=$(curl -fsS --max-time 10 https://aspirely.me/api/health | jq -r .revision || true)
            echo "attempt ${attempt}: live=${REV}"
            if [ "$REV" = "$TAG" ]; then
              echo "### Backend live: \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done
          echo "::error::The site does not report $TAG after 15 minutes; the previous version is still serving. On the box: journalctl -u jobpilot-pull-deploy"
          exit 1
