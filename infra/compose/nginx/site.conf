# Only cloudflared can reach this server, so CF-Connecting-IP is Cloudflare's
# word for the client. It REPLACES X-Forwarded-For, which a client can forge;
# utils.security.get_client_ip reads it with TRUSTED_PROXY_HOPS=1.
include /etc/jobpilot/nginx/upstream.conf;

map $http_cf_connecting_ip $client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

client_max_body_size 10m;
server_tokens off;
gzip on;
gzip_min_length 256;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 8080 default_server;
    server_name aspirely.me www.aspirely.me;

    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    # Flask sets the other security headers on these responses.
    location /api/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        proxy_pass http://api_active;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
    }

    # Hashed filenames: safe to cache forever. Old ones stay on disk after a
    # deploy, so a tab opened before it can still load its chunks.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}

# Signed links only (mail attachments, the mail Worker's upload). Anything
# without a signature stops here, so the store's API is not public.
server {
    listen 8080;
    server_name files.aspirely.me;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 40m;

    location / {
        limit_except GET PUT { deny all; }
        if ($arg_X-Amz-Signature = "") {
            return 403;
        }
        proxy_pass http://s3:7070;
        proxy_http_version 1.1;
        # The signature covers this exact host.
        proxy_set_header Host files.aspirely.me;
        proxy_request_buffering off;
    }
}
