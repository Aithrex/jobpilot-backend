# systemd drop-in for the ingest runner on the Oracle Cloud Always Free box.
# Installed to /etc/systemd/system/ingest-runner.service.d/oracle.conf by
# pull-deploy.sh on every deploy, so it ships from git like everything else.
#
# The unit itself is infra/ec2/ingest-runner.service, UNCHANGED: one unit, two
# hosts, so the sizing dials and the sources a box owns cannot drift apart.
# This file overrides only what is different off AWS.
[Service]
# No instance profile and no SSM off AWS. The env file sets
# USE_SSM_SECRETS=false, MONGODB_URI, and the narrow S3 keys for the JD store.
# EnvironmentFile= wins over the unit's Environment= lines for the same key.
EnvironmentFile=/etc/jobpilot/ingest-runner.env

# VM.Standard.A1.Flex, 4 OCPU / 24 GB. The unit's 1200M cap was sized for a
# 2 GB t3.small; keep the same "kill the unit, not the box" intent with room.
MemoryMax=8G
